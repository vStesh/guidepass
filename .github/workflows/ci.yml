name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx oxlint .
      - run: npm test
      # The committed migrations must match api/src/db/schema.ts.
      - name: Migrations are up to date
        run: |
          npm run db:generate -w api
          if [ -n "$(git status --porcelain api/migrations)" ]; then
            echo "::error::Schema changed without a migration. Run: npm run db:generate -w api, and commit api/migrations."
            git status --porcelain api/migrations
            exit 1
          fi
      - run: npm run build

  infra:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"
      - run: terraform fmt -check -recursive
      # No backend and no AWS credentials: this only checks the configuration.
      - run: terraform init -backend=false -input=false
      - run: terraform validate
